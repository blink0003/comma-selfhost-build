name: build-and-test
on:
  push:
    branches: [android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/release.jks ]; then
            keytool -genkeypair -v -keystore keystore/release.jks -alias comma -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass commabox2 -keypass commabox2 -dname "CN=Comma Box2, O=Personal, C=CN"
            git config user.name ci; git config user.email ci@users.noreply.github.com
            git add keystore/release.jks
            git commit -m "add keystore [skip ci]"
            git push origin HEAD:android
          fi
      - name: Build
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease :app:lintRelease 2>&1 | tee build.log
      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs $APK | tee report.txt
          $BT/aapt2 dump badging $APK | head -5 | tee -a report.txt
          ls -la $APK | tee -a report.txt
          cp $APK Comma-box2.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash ci/emutest.sh
      - name: Publish outputs
        if: always()
        run: |
          mkdir -p /tmp/out
          cp -f Comma-box2.apk report.txt build.log /tmp/out/ 2>/dev/null || true
          cp -f app/build/reports/lint-results-release.txt /tmp/out/ 2>/dev/null || true
          touch /tmp/out/.keep
          cp -rf test-out/* /tmp/out/ 2>/dev/null || true
          git config user.name ci; git config user.email ci@users.noreply.github.com
          true
          git checkout --orphan out-new
          git rm -rf --cached . >/dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/out/. .
          echo "${{ github.sha }} run ${{ github.run_id }}" > BUILD.txt
          git add -A
          git commit -m "outputs ${{ github.run_id }}"
          git push -f origin out-new:android-out
